<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Melovia</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Simple contact form styling */
      .contact-form {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .contact-form input,
      .contact-form textarea {
        padding: 10px;
        font-size: 1rem;
        border: 1px solid var(--input-border);
        border-radius: 4px;
        width: 100%;
        background-color: var(--input-bg);
        color: var(--text-primary);
      }
      .contact-form button {
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 4px;
        background-color: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      .contact-form button:hover {
        background-color: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header class="site-header">
        <div class="logo-container">
          <img src="logo.png" alt="Melovia Logo" class="logo-image" />
          <span class="site-title">Melovia</span>
        </div>
      </header>
      <nav>
        <a href="index.html">Home</a>
        <a href="playlists.html">Playlists</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html" class="active-link">Contact</a>
        <!-- Logout link for signing out -->
        <a href="#" id="logout-link">Logout</a>
        <input type="text" id="search-input" class="search-input" placeholder="Search songs..." />
        <input type="color" id="accent-color-picker" value="#1db954" title="Choose accent colour" />
      </nav>
      <main style="padding: 40px;">
        <h2>Contact Us</h2>
        <p>Have a question or feedback? Send us a message using the form below.</p>
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you for your message!'); this.reset();">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </main>
    </div>
    <script src="auth.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
