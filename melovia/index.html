<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melovia</title>
    <!-- External styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="site-header">
        <div class="logo-container">
          <img src="logo.png" alt="Melovia Logo" class="logo-image" />
          <span class="site-title">Melovia</span>
        </div>
      </header>
      <nav>
        <a href="index.html" class="active-link">Home</a>
        <a href="playlists.html">Playlists</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <!-- Logout link: clicking this will sign you out and return to the login page -->
        <a href="#" id="logout-link">Logout</a>
        <!-- Search input for filtering songs on the home page -->
        <input type="text" id="search-input" class="search-input" placeholder="Search songs..." />
        <!-- Accent colour picker for theme customisation -->
        <input type="color" id="accent-color-picker" value="#1db954" title="Choose accent colour" />
      </nav>
      <main class="home-main">
        <div class="layout">
          <!-- Sidebar similar to Spotify's library panel -->
          <aside class="sidebar">
            <h3>Your Library</h3>
            <!-- The create playlist prompt and button have been removed from the home page -->
            <!-- Upload button and file input for adding songs -->
            <div class="sidebar-section">
              <!-- Visible button to trigger the hidden file input -->
              <button id="upload-audio-btn" class="upload-audio-btn">Upload Audio</button>
              <input
                type="file"
                id="file-input"
                accept="audio/*"
                multiple
                style="display: none;"
              />
            </div>
            <!-- Optional list of songs in library (hidden on large screens) -->
            <div id="song-list" class="sidebar-library"></div>
          </aside>
          <!-- Main content with trending songs and popular artists -->
          <section class="main-content">
            <!-- A button to trigger the file upload from the top of the page -->
            <button id="upload-audio-btn" class="upload-audio-btn">Upload Audio</button>
            <!-- Upload button in the main content area to allow adding songs without opening the sidebar -->
            <button id="upload-audio-main-btn" class="upload-audio-btn">Upload Audio</button>
            <h2>Trending songs</h2>
            <div class="trending-grid" id="trending-grid"></div>
            <h2>Popular artists</h2>
            <div class="artists-row" id="artists-row"></div>

            <h2>Recently played</h2>
            <div class="recently-played-row" id="recently-played-row"></div>
          </section>
        </div>
      </main>
      <!-- Persistent player bar at the bottom -->
      <div class="player-bar">
        <div class="player-info">
          <!-- Album art thumbnail for the currently playing song -->
          <img id="player-album-art" class="player-album-art" src="" alt="Album Art" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-right: 16px;" />
          <div class="player-text">
            <h4 id="song-title"></h4>
            <p id="song-artist"></p>
          </div>
        </div>
        <div class="player-controls">
          <!-- Shuffle and loop controls -->
          <button id="shuffle-btn" aria-label="Shuffle">🔀</button>
          <button id="prev-btn" aria-label="Previous track">&#x23EE;</button>
          <button id="play-pause-btn" aria-label="Play or pause">▶</button>
          <button id="next-btn" aria-label="Next track">&#x23ED;</button>
          <button id="loop-btn" aria-label="Loop">🔁</button>
          <!-- Toggle album art visibility -->
          <button id="toggle-album-btn" aria-label="Toggle album art">🖼️</button>
        </div>
        <div class="player-progress">
          <span class="time-display" id="current-time">0:00</span>
          <input
            type="range"
            id="progress-range"
            min="0"
            max="0"
            step="0.1"
            value="0"
          />
          <span class="time-display" id="duration">0:00</span>
        </div>
        <div class="player-volume">
          <span class="volume-icon">🔊</span>
          <input
            type="range"
            id="volume-range"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </div>
        <audio id="audio" preload="metadata"></audio>
      </div>

      <!-- Album pop-up container to display larger cover and song info on the right side -->
      <div id="album-popup" class="album-popup">
        <img id="popup-album-art" src="" alt="Album Cover" style="width: 80px; height: 80px; border-radius: 6px; object-fit: cover; margin-right: 12px;" />
        <div class="popup-text">
          <h4 id="popup-song-title" style="margin: 0; font-size: 1rem; color: var(--text-primary);"></h4>
          <p id="popup-song-artist" style="margin: 4px 0 0; font-size: 0.8rem; color: var(--text-secondary);"></p>
        </div>
      </div>
    </div>
    <!-- Authentication gating -->
    <script src="auth.js"></script>
    <!-- Main app logic -->
    <script src="script.js"></script>
    <!-- Theme customisation script -->
    <script src="theme.js"></script>
  </body>
</html>
