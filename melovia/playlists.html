<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlists - Melovia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="site-header">
        <div class="logo-container">
          <img src="logo.png" alt="Melovia Logo" class="logo-image" />
          <span class="site-title">Melovia</span>
        </div>
      </header>
      <nav>
        <a href="index.html">Home</a>
        <a href="playlists.html" class="active-link">Playlists</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <!-- Logout link for signing out -->
        <a href="#" id="logout-link">Logout</a>
        <input type="text" id="search-input" class="search-input" placeholder="Search songs..." />
        <input type="color" id="accent-color-picker" value="#1db954" title="Choose accent colour" />
      </nav>
      <main style="padding: 40px; position: relative; padding-bottom: 120px;">
        <h2>Your Playlists</h2>
        <!-- Playlist creation form -->
        <div id="create-playlist" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
          <input
            type="text"
            id="new-playlist-name"
            placeholder="New playlist name"
            style="padding: 8px; border: 1px solid var(--input-border); border-radius: 4px; background-color: var(--input-bg); color: var(--text-primary); flex: 1;"
          />
          <button id="create-playlist-btn" style="padding: 8px 16px; background-color: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.2s ease;">
            Create
          </button>
        </div>
        <!-- List of playlists -->
        <ul id="playlist-list" style="list-style: none; padding: 0; margin: 0;"></ul>
        <!-- Playlist viewer: displays songs in a selected playlist -->
        <div id="playlist-viewer" style="margin-top: 20px;"></div>
        <!-- Playlist editor for adding/removing songs -->
        <div id="playlist-editor" style="display: none; margin-top: 30px; padding: 20px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--secondary-bg);">
          <h3 id="editor-title" style="margin-top: 0;"></h3>
          <div id="song-selection" class="song-selection" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
          <div style="display: flex; gap: 10px;">
            <button id="save-playlist-btn" style="padding: 8px 16px; background-color: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.2s ease;">Save</button>
            <button id="cancel-edit-btn" style="padding: 8px 16px; background-color: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.2s ease;">Cancel</button>
          </div>
        </div>
      </main>
      </div>
      <!-- Player bar replicated from home page for playing songs in playlists -->
      <div class="player-bar">
        <div class="player-info">
          <img id="player-album-art" class="player-album-art" src="" alt="Album Art" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-right: 16px;" />
          <div class="player-text">
            <h4 id="song-title"></h4>
            <p id="song-artist"></p>
          </div>
        </div>
        <div class="player-controls">
          <button id="shuffle-btn" aria-label="Shuffle">🔀</button>
          <button id="prev-btn" aria-label="Previous track">&#x23EE;</button>
          <button id="play-pause-btn" aria-label="Play or pause">▶</button>
          <button id="next-btn" aria-label="Next track">&#x23ED;</button>
          <button id="loop-btn" aria-label="Loop">🔁</button>
          <button id="toggle-album-btn" aria-label="Toggle album art">🖼️</button>
        </div>
        <div class="player-progress">
          <span class="time-display" id="current-time">0:00</span>
          <input type="range" id="progress-range" min="0" max="0" step="0.1" value="0" />
          <span class="time-display" id="duration">0:00</span>
        </div>
        <div class="player-volume">
          <span class="volume-icon">🔊</span>
          <input type="range" id="volume-range" min="0" max="1" step="0.01" value="1" />
        </div>
        <audio id="audio" preload="metadata"></audio>
      </div>

      <!-- Album pop-up container to display larger cover and song info on the right side -->
      <div id="album-popup" class="album-popup">
        <img id="popup-album-art" src="" alt="Album Cover" style="width: 80px; height: 80px; border-radius: 6px; object-fit: cover; margin-right: 12px;" />
        <div class="popup-text">
          <h4 id="popup-song-title" style="margin: 0; font-size: 1rem; color: var(--text-primary);"></h4>
          <p id="popup-song-artist" style="margin: 4px 0 0; font-size: 0.8rem; color: var(--text-secondary);"></p>
        </div>
      </div>
    </div>
    <script src="auth.js"></script>
    <!-- Load the main script to provide playback functionality on this page -->
    <script src="script.js"></script>
    <script src="playlists.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
